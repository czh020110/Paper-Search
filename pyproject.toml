[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-search"
version = "0.1.0"
description = "Offline minimal loop for academic paper search"
readme = "README-参考.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.49.0",
]

[project.scripts]
paper-search = "paper_search.cli:main"
paper-search-web = "paper_search.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
